<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL 2.0 — Live Ledger</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: #12151c;
    --panel-border: #232733;
    --text: #e6e8eb;
    --muted: #8b93a3;
    --accent: #5eead4;
    --green: #22c55e;
    --yellow: #eab308;
    --orange: #f97316;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  header h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .controls { display: flex; align-items: center; gap: 12px; }
  #dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }

  #investigatingBanner {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 28px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #93c5fd;
    background: linear-gradient(180deg, rgba(59,130,246,0.16), rgba(59,130,246,0.04));
    border-bottom: 1px solid rgba(59,130,246,0.35);
    animation: investigatingPulse 1.6s ease-in-out infinite;
  }
  #investigatingBanner.active { display: flex; }
  @keyframes investigatingPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .spinner {
    width: 13px; height: 13px;
    border: 2px solid rgba(147,197,253,0.3);
    border-top-color: #93c5fd;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #banner {
    display: none;
    margin: 0;
    padding: 22px 28px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.5px;
  }
  #banner.ok {
    display: block;
    background: linear-gradient(180deg, rgba(34,197,94,0.18), rgba(34,197,94,0.04));
    color: var(--green);
    border-bottom: 1px solid rgba(34,197,94,0.4);
  }
  #banner.fail {
    display: block;
    background: linear-gradient(180deg, rgba(239,68,68,0.35), rgba(239,68,68,0.08));
    color: #fff;
    border-bottom: 2px solid var(--red);
    animation: flash 0.9s infinite;
  }
  @keyframes flash {
    0%, 100% { background-color: rgba(239,68,68,0.35); }
    50% { background-color: rgba(239,68,68,0.65); }
  }

  main { padding: 24px 28px 60px; max-width: 980px; margin: 0 auto; }
  #empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left-width: 5px;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card.LOW { border-left-color: var(--green); }
  .card.MEDIUM { border-left-color: var(--yellow); }
  .card.HIGH { border-left-color: var(--orange); }
  .card.CRITICAL { border-left-color: var(--red); }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .meta { color: var(--muted); font-size: 12.5px; }
  .meta b { color: var(--text); }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .badge.LOW { background: rgba(34,197,94,0.18); color: var(--green); }
  .badge.MEDIUM { background: rgba(234,179,8,0.18); color: var(--yellow); }
  .badge.HIGH { background: rgba(249,115,22,0.18); color: var(--orange); }
  .badge.CRITICAL { background: rgba(239,68,68,0.22); color: var(--red); }

  .justification { margin-top: 10px; font-size: 14px; line-height: 1.45; }
  .action-tag {
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 6px;
  }

  details { margin-top: 10px; }
  summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    outline: none;
  }
  pre {
    background: #05070a;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px;
    margin-top: 8px;
    font-size: 12px;
    overflow-x: auto;
    color: #b8c0cc;
    max-height: 340px;
  }
  .hash { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div>
    <h1>SENTINEL <span>2.0</span> — Live Ledger</h1>
    <div class="sub"><span id="dot"></span>&nbsp; polling every 2s · <span id="count">0</span> records</div>
  </div>
  <div class="controls">
    <button id="verifyBtn">Verify Ledger</button>
  </div>
</header>

<div id="investigatingBanner"><span class="spinner"></span><span id="investigatingText">Investigating...</span></div>

<div id="banner"></div>

<main>
  <div id="empty">Waiting for incident data from the agentic loop...</div>
  <div id="list"></div>
</main>

<script>
const SEVERITIES = ["LOW", "MEDIUM", "HIGH", "CRITICAL"];

function normSeverity(s) {
  s = (s || "LOW").toUpperCase();
  return SEVERITIES.includes(s) ? s : "LOW";
}

function fmtTime(ts) {
  try {
    const d = new Date(ts.endsWith("Z") || ts.includes("+") ? ts : ts + "Z");
    return d.toLocaleString();
  } catch (e) { return ts; }
}

async function refreshLogs() {
  try {
    const res = await fetch("/api/ledger-logs");
    const records = await res.json();
    renderRecords(records);
  } catch (e) {
    console.error("Failed to fetch ledger logs", e);
  }
}

async function refreshStatus() {
  const el = document.getElementById("investigatingBanner");
  const textEl = document.getElementById("investigatingText");
  try {
    const res = await fetch("/api/status");
    const data = await res.json();
    if (data.busy) {
      el.classList.add("active");
      const camera = data.camera ? ` on ${escapeHtml(data.camera)}` : "";
      textEl.textContent = `Investigating${camera}... (${data.elapsed_seconds}s so far — a deep-reasoning pass can take up to ~2 min, this is normal)`;
    } else {
      el.classList.remove("active");
    }
  } catch (e) {
    // If /api/status itself is unreachable the dashboard is genuinely down, not just slow —
    // leave the banner as-is rather than guessing.
    console.error("Failed to fetch status", e);
  }
}

function renderRecords(records) {
  document.getElementById("count").textContent = records.length;
  const empty = document.getElementById("empty");
  const list = document.getElementById("list");

  if (!records.length) {
    empty.style.display = "block";
    list.innerHTML = "";
    return;
  }
  empty.style.display = "none";

  list.innerHTML = records.map(r => {
    const sev = normSeverity(r.severity);
    const justification = r.justification || "(no justification recorded)";
    const actionLabel = r.action === "raise_alert" ? "ALERT RAISED" : "LOGGED BENIGN";
    const trace = JSON.stringify(r.tool_call_trace || [], null, 2);
    return `
      <div class="card ${sev}">
        <div class="card-top">
          <div class="meta">
            <b>#${r.id}</b> &nbsp;·&nbsp; ${fmtTime(r.timestamp)} &nbsp;·&nbsp; camera: <b>${escapeHtml(r.camera)}</b>
          </div>
          <span class="badge ${sev}">${sev}</span>
        </div>
        <div class="justification">
          <span class="action-tag">${actionLabel}</span>${escapeHtml(justification)}
        </div>
        <details>
          <summary>Tool-call trace (${(r.tool_call_trace || []).length} calls)</summary>
          <pre>${escapeHtml(trace)}</pre>
        </details>
        <div class="hash" style="margin-top:8px;">prev: ${r.previous_hash.slice(0,16)}... → curr: ${r.current_hash.slice(0,16)}...</div>
      </div>
    `;
  }).join("");
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function verifyLedger() {
  const banner = document.getElementById("banner");
  banner.className = "";
  banner.textContent = "Verifying...";
  banner.style.display = "block";
  try {
    const res = await fetch("/api/verify");
    const data = await res.json();
    if (data.valid) {
      banner.className = "ok";
      banner.textContent = `✅ LEDGER VERIFIED — full chain and all signatures valid (${data.message})`;
    } else {
      banner.className = "fail";
      banner.textContent = `🚨 TAMPER DETECTED — chain broken at record #${data.broken_at} — ${data.message}`;
    }
  } catch (e) {
    banner.className = "fail";
    banner.textContent = "🚨 Could not reach /api/verify — is host_server.py running?";
  }
}

document.getElementById("verifyBtn").addEventListener("click", verifyLedger);

refreshLogs();
refreshStatus();
setInterval(refreshLogs, 2000);
setInterval(refreshStatus, 2000);
</script>

</body>
</html>
