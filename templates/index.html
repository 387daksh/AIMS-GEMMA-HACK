<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL 2.0 | Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --surface-bg: #0A0A0A;
            --border-color: #1A1A1A;
            --accent: #EAEAEA;
            --accent-dim: #888888;
            --alert-red: #FF3B30;
            --success: #34C759;
            --text-main: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 2rem 4rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo span {
            color: var(--accent-dim);
            font-weight: 400;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 1px;
            background: rgba(52, 199, 89, 0.1);
            color: var(--success);
            border: 1px solid rgba(52, 199, 89, 0.2);
            transition: all 0.3s ease;
        }

        .status-badge.alert-critical {
            background: rgba(255, 59, 48, 0.1);
            color: var(--alert-red);
            border-color: rgba(255, 59, 48, 0.3);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(255, 59, 48, 0.3); }
            50% { border-color: rgba(255, 59, 48, 0.8); }
            100% { border-color: rgba(255, 59, 48, 0.3); }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 24px;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-dim);
            font-weight: 600;
            background: #050505;
        }

        /* Video Grid */
        .video-container {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: #000;
        }
        
        .video-feed {
            position: relative;
            background: #000;
            border: 1px solid var(--border-color);
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        .video-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .feed-main {
            grid-column: 1 / -1;
        }

        .feed-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            padding: 4px 8px;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid #333;
            color: #ccc;
        }

        /* Terminal Log */
        .terminal {
            flex: 1;
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #000;
        }

        .terminal::-webkit-scrollbar {
            width: 4px;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: var(--border-color);
        }

        .log-entry {
            line-height: 1.5;
            color: #A0A0A0;
            opacity: 0;
            transform: translateX(10px);
            animation: slideIn 0.4s ease forwards;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        .log-header {
            color: var(--text-main);
            font-weight: 600;
            margin-top: 1rem;
            padding-bottom: 4px;
            border-bottom: 1px dashed #333;
        }

        .log-tool {
            color: #EAEAEA;
        }
        
        .log-highlight {
            color: #34C759;
        }

        .log-alert {
            color: var(--alert-red);
            font-weight: 600;
            margin-top: 10px;
        }

        .log-speak {
            color: #5AC8FA;
            font-style: italic;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">SENTINEL <span>2.0 CORE</span></div>
        <div class="status-badge" id="system-status">SYSTEM ARMED</div>
    </header>

    <div class="dashboard-grid">
        <!-- LEFT COLUMN: Video Feeds -->
        <div class="panel">
            <div class="panel-header">Live Sensor Matrix</div>
            <div class="video-container">
                <div class="video-feed feed-main">
                    <img src="http://127.0.0.1:5001/video_feed/yolo" alt="YOLO Feed" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100%\' height=\'100%\'><rect width=\'100%\' height=\'100%\' fill=\'%23000\'/></svg>'">
                    <div class="feed-label">CAM 01 // INFERENCE</div>
                </div>
                <div class="video-feed">
                    <img src="http://127.0.0.1:5001/video_feed/original" alt="Original Feed" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100%\' height=\'100%\'><rect width=\'100%\' height=\'100%\' fill=\'%23000\'/></svg>'">
                    <div class="feed-label">CAM 01 // RAW</div>
                </div>
                <div class="video-feed">
                    <img src="http://127.0.0.1:5001/video_feed/privacy" alt="Privacy Feed" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100%\' height=\'100%\'><rect width=\'100%\' height=\'100%\' fill=\'%23000\'/></svg>'">
                    <div class="feed-label">CAM 01 // HIPAA MASK</div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Gemma Brain Logs -->
        <div class="panel">
            <div class="panel-header">Gemma Orchestrator Trace</div>
            <div class="terminal" id="terminal-log">
                <div class="log-entry" style="opacity: 1; transform: none;">
                    System initialized. Awaiting candidate events...
                </div>
            </div>
        </div>
    </div>

    <script>
        const terminalLog = document.getElementById('terminal-log');
        const systemStatus = document.getElementById('system-status');
        
        let lastLogCount = 0;

        function appendUI(html, className="") {
            const entry = document.createElement('div');
            entry.className = `log-entry ${className}`;
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], {hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit'});
            
            if (className.includes("log-header")) {
                entry.innerHTML = html;
            } else {
                entry.innerHTML = `<span style="color:#666">[${timeStr}]</span> ${html}`;
            }
            
            terminalLog.appendChild(entry);
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        async function pollLiveLogs() {
            try {
                const res = await fetch('http://127.0.0.1:8000/api/live-logs');
                if (res.ok) {
                    const logs = await res.json();
                    
                    if (logs.length < lastLogCount) {
                        // Backend was reset (new event)
                        terminalLog.innerHTML = '';
                        lastLogCount = 0;
                    }
                    
                    if (logs.length > lastLogCount) {
                        for (let i = lastLogCount; i < logs.length; i++) {
                            const log = logs[i];
                            
                            if (log.type === "header") {
                                appendUI(log.msg, "log-header");
                                if (log.msg.includes("ANOMALY")) {
                                    systemStatus.textContent = 'INVESTIGATING...';
                                    systemStatus.classList.remove('alert-critical');
                                }
                            } else if (log.type === "info") {
                                appendUI(log.msg);
                            } else if (log.type === "tool") {
                                appendUI(`Executing <span class="log-tool">${log.tool}</span>: ${JSON.stringify(log.args)}`);
                            } else if (log.type === "alert") {
                                appendUI(log.msg, "log-alert");
                                if (log.msg.includes("CRITICAL ALERT")) {
                                    systemStatus.textContent = 'CRITICAL ALERT';
                                    systemStatus.classList.add('alert-critical');
                                }
                            }
                        }
                        lastLogCount = logs.length;
                    }
                }
            } catch (err) {
                console.error("Live log polling error", err);
            }
        }

        setInterval(pollLiveLogs, 500); // Poll every 500ms for snappy real-time UI
    </script>
</body>
</html>
